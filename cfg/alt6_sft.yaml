# alt6_sft -- SFT config for the alt2-trained checkpoint (named "alt6" at PT time).
#
# SFT runs on the pretraining engine: loomsft.py only supplies the tokenized
# example cache and the packing stream, everything else (DDP, compile, custom-op
# graph capture, prefetch, eval, checkpoints/runpoints/resume) is loomformer.py's
# training loop. Every field below is therefore read on this path exactly as it
# is during pretraining.
#
# Model/tokenizer/RoPE/Tria blocks are copied verbatim from cfg/alt2.yaml: they
# MUST match the pretrained checkpoint's geometry, since --init-checkpoint loads
# weights into a freshly constructed Model(cfg).
#
#   python3 loomsft.py --config cfg/alt6_sft.yaml \
#       --sft-dataset ./sft/FSSFT1/FSSFT1.parquet \
#       --init-checkpoint alt6/alt6.pt \
#       --checkpoint alt6_sft.pt
#
# (identical to: python3 loomformer.py --config ... --sft-dataset ... )

optimizer: atom                     # atom | adamw
steps: 20000
lr: 5e-5
weight_decay: 0.01
grad_clip: 1.0
warmup_steps: 150
min_lr_frac: 0.1
seed: 1
log_every: 20
eval_every: 200                     # null = every log_every
eval_batches: 8
device: cuda:0, cuda:1              # DDP self-launch, same as pretraining
grad_accum_steps: 1
grad_checkpointing: true
fused_linear_ce: true               # chunked LM-head+CE, avoids materializing [N,VOCAB] logits
amp_dtype: bf16                     # bf16 | fp32 | fp16 | off
save_every: 1000
save_initial_checkpoint: false      # true only on a fresh run (rejected with --resume)
runpoints_path: ./runpoints
resume: null
resume_data_stream: auto            # auto | always | never
compile: false
graph: false
save_graph: false

# sequence / batch
seq_len: 4096                       # must be > 0
batch_size: 40                      # global batch: must be divisible by the GPU count

# SFT data
# train_dataset is informational: --sft-dataset sets dataset_format=sft and the
# path. auto_val_split_pct carves the tail of the tokenized cache into a '#val'
# split -- unlike pretraining, the dataset file itself is never rewritten.
dataset_format: sft
train_dataset: ./sft/FSSFT1/FSSFT1.parquet
val_dataset: null
auto_val_split_pct: 0.5
dataset_cache: mmap                 # mmap | ram (tokenized example cache)
prefetch_batches: 16
gpu_prefetch_batches: 4

# positional encoding -- must match the pretrained checkpoint
rope_theta: 10000.0                 # must be > 0
rope_original_seq_len: 2048         # null | > 0
rope_factor: 4.0                    # must be > 0
rope_beta_fast: 32.0                # must be > 0
rope_beta_slow: 1.0                 # must be > 0
rope_attention_factor: null

# carrier Tria and temporal refeed -- restored from the checkpoint at startup
# (lf.restore_temporal_tria_from_checkpoint); kept identical to alt2.yaml here
# for clarity, since Config is still the source of truth for W/alpha/beta.
tria_carry_enabled: true            # true requires tria_temporal_enabled: true
use_cuda_tria: true
tria_gamma_max: 0.80
tria_raw_gamma_init: 0.01
tria_temporal_enabled: true
tria_temporal_auto: false           # false requires tria_temporal_window
tria_temporal_window: 256           # must be > 0
tria_temporal_window_min: 32
tria_target_refeeds_per_sequence: 15
tria_carrier_alpha: 0.1             # must be finite and > 0
tria_polarm_beta: 0.5               # must be finite and in [0, 1)

# data / tokenizer -- must match the pretrained checkpoint's vocab exactly
tokenizer: ./tokenizers/tokenizer32768.json     # null | local .json | Hugging Face name/path
vocab: 32768                        # must be > 0
tied_embeddings: true

# model shape -- must match the pretrained checkpoint exactly
model_dim: 576                      # with head_dim: = q_heads*head_dim; otherwise divisible by q_heads
n_q_heads: 24                       # must be > 0
head_dim: 24                        # must be even; multiple of 4 enables fast CUDA path
n_kv_heads: 6                       # must divide n_q_heads; with group: product = n_q_heads
gqa_group_size: 4                   # must divide n_q_heads; with kv heads: product = n_q_heads

# Paraplex FFN
hidden: null                        # null | positive multiple of n_q_heads
hidden_mult: 6
layers: 20                          # must be > 0
final_norm: true
paraplex_gate_proj: true

# phase / residual / activation knobs
phase_sectors: open                 # head | open
residual_init: beta                 # beta | fanin
depth_attn_readout: shared          # shared | per-sublayer
depth_attn_qkv_rms: true
residual_branch_rms_cap: 1.0        # null | > 0
activation: pvpowlu                 # gelu | powlu | pvpowlu
powlu_m: 3.0
phase_grad_floor: 0.05
phase_grad_mode: secant             # floor | secant
attn_impl: auto                     # auto | flash | sdpa | manual

# precision / CUDA fast paths
use_cuda_beta_space: true
use_cuda_phase_sin: true
use_cuda_pvpowlu: true
use_cuda_depth_attn: true
